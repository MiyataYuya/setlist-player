<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    maskable（Android アダプティブ）と apple-touch-icon のソース。
    どちらも OS 側が角丸や円形に切り抜くため、背景は端まで塗りきる。
    マークは中央の直径80%の円（セーフゾーン）に収める。public/icon.svg と座標を共有。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="bars" x1="104" y1="158" x2="360" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5d8ff"/>
      <stop offset="1" stop-color="#7cb9f0"/>
    </linearGradient>
    <linearGradient id="play" x1="294" y1="262" x2="408" y2="354" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8a7c4"/>
      <stop offset="1" stop-color="#e8739f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g fill="url(#bars)">
    <rect x="104" y="158" width="256" height="36" rx="18"/>
    <rect x="104" y="224" width="256" height="36" rx="18"/>
    <rect x="104" y="290" width="152" height="36" rx="18"/>
  </g>
  <path d="M302 276 L392 308 L302 340 Z"
        fill="url(#play)" stroke="url(#play)" stroke-width="16" stroke-linejoin="round"/>
</svg>
